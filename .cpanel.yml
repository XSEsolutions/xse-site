---
deployment:
  tasks:
    # o dominio xsesolutions.com serve esta pasta, nao a public_html
    - export DEPLOYPATH=$HOME/xsesolutions.com
    - /bin/mkdir -p $DEPLOYPATH/assets/proj
    - /bin/cp -f index.html $DEPLOYPATH/
    - /bin/cp -Rf assets/. $DEPLOYPATH/assets/
    # pastas 755 e arquivos 644, senao a proxima publicacao trava
    - /bin/chmod -R u+rwX,go+rX,go-w $DEPLOYPATH
